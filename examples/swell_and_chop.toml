# Swell and chop: long calm swells with short, sharp chop riding on top.
# The [water] layer is the swell; [water.chop] is generated separately and added.
# The two reliefs add up (0.17 + 0.08 = 0.25 in), which fits the default thickness budget.

[water]
seed                   = 5
wavelength_dominant    = 2.0
wavelength_min         = 1.2
wavelength_max         = 4.0
directional_spread_deg = 20.0
choppiness             = 0.2
relief                 = 0.17

[water.chop]
wavelength_dominant    = 0.5
wavelength_min         = 0.25
wavelength_max         = 0.9
directional_spread_deg = 70.0
choppiness             = 0.9
relief                 = 0.08
