[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "choppy-water"
version = "0.0.1"
description = "Generate a choppy-water heightfield as a watertight STL for CNC milling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "trimesh>=4",
    "matplotlib>=3.8",
]

[project.scripts]
choppy-water = "choppy_water.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/choppy_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
