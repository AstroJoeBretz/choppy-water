# Choppy Gerstner: the choppy look built from Gerstner waves instead of an FFT sea.
# A sum of 64 Gerstner waves: slightly more regular, and a little cheaper to compute.

[water]
method                 = "gerstner"
seed                   = 21
wavelength_dominant    = 0.8
wavelength_min         = 0.3
wavelength_max         = 1.6
directional_spread_deg = 40.0
choppiness             = 0.8
relief                 = 0.25
