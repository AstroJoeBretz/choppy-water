# Swell and chop plaque: a 6 x 3.5 in rectangle, calm swells with sharp chop on top.
# [water] is the swell, [water.chop] is generated separately and added.
# The two reliefs add up (0.12 + 0.04 = 0.16 in), within the default thickness budget.

[part]
shape  = "rect"
width  = 6.0
length = 3.5

[water]
seed                   = 11
wavelength_dominant    = 1.0
wavelength_min         = 0.9
wavelength_max         = 1.1
wind_direction_deg     = 30.0
directional_spread_deg = 5.0
choppiness             = 0.05
relief                 = 0.12

[water.chop]
wavelength_dominant    = 0.3
wavelength_min         = 0.25
wavelength_max         = 0.45
directional_spread_deg = 7.0
choppiness             = 0.9
relief                 = 0.04
