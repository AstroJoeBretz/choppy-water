# Stormy: steep, short waves from many directions with cusped crests.
# Needs more thickness above the base, so max_thickness is raised (stock is 1 in).

[part]
max_thickness = 0.65

[water]
seed                   = 3
wavelength_dominant    = 0.6
wavelength_min         = 0.25
wavelength_max         = 1.4
directional_spread_deg = 70.0
choppiness             = 0.55
relief                 = 0.35
