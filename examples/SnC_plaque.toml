# Plaque: a 5 x 3.5 in rectangle instead of a disc, default water.

[part]
shape  = "rect"
width  = 6.0
length = 3.5
max_thickness  = 0.75

[water]
seed = 43
wavelength_dominant    = 1.3
wavelength_min         = 1.2
wavelength_max         = 1.4
wind_direction_deg     = 20.0
directional_spread_deg = 5.0
choppiness             = 0.05
relief                 = 0.2

[water.chop]
wavelength_dominant    = 0.25
wavelength_min         = 0.2
wavelength_max         = 0.35
wind_direction_deg     = -5.0
directional_spread_deg = 8.0
choppiness             = 0.9
relief                 = 0.04

[mesh]
grid_spacing  = 0.01
