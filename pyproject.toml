[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "choppy-water"
version = "0.1.0"
description = "Generate a choppy-water heightfield as a watertight STL for CNC milling."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joe Bretz" }]
keywords = ["cnc", "stl", "heightfield", "ocean", "waves", "woodworking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "trimesh>=4",
    "matplotlib>=3.8",
]

[project.scripts]
choppy-water = "choppy_water.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/choppy_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
